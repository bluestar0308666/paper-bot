<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Bot · 论文解读库</title>
<style>
:root{--ink:#17212b;--muted:#68727d;--line:#e5e9ec;--paper:#fff;--bg:#f4f7f6;--brand:#147d64;--brand2:#0d5f4c;--soft:#eaf6f1;--danger:#b43b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header{background:linear-gradient(135deg,#0d5f4c,#178b70);color:#fff;padding:28px 20px 48px}.head{max-width:1040px;margin:auto;display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.brand h1{margin:0 0 7px;font-size:26px}.brand p{margin:0;color:#d8f2e9;font-size:14px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools a{color:#fff;border:1px solid #ffffff70;padding:7px 11px;border-radius:8px;text-decoration:none;font-size:13px}main{max-width:1040px;margin:-28px auto 40px;padding:0 18px}.panel,.card{background:var(--paper);border:1px solid var(--line);box-shadow:0 8px 26px #20352d0b;border-radius:14px}.panel{padding:18px;margin-bottom:18px}textarea{width:100%;min-height:90px;border:1px solid #d6dcda;border-radius:10px;padding:12px;font:14px/1.6 inherit;resize:vertical;background:#fff;color:var(--ink)}.bar,.search{display:flex;gap:9px;margin-top:10px}.search input{flex:1;border:1px solid #d6dcda;border-radius:9px;padding:10px 12px;font:14px inherit}button{border:0;border-radius:9px;padding:10px 15px;background:var(--brand);color:#fff;font:600 14px inherit;cursor:pointer}button:hover{background:var(--brand2)}button.secondary{background:#edf1ef;color:#34413c}button.ghost{background:transparent;color:var(--muted);padding:5px 8px}button.danger{color:var(--danger)}button:disabled{opacity:.55}.status{min-height:20px;margin-top:10px;color:var(--muted);font-size:13px}.section-title{display:flex;align-items:end;justify-content:space-between;margin:22px 2px 12px}.section-title h2{margin:0;font-size:19px}.section-title span{font-size:13px;color:var(--muted)}.card{padding:20px;margin-bottom:13px;transition:.18s}.card:hover{transform:translateY(-1px);box-shadow:0 12px 30px #20352d12}.card-top{display:flex;gap:16px;justify-content:space-between}.title{margin:0;font-size:18px;line-height:1.45}.title a{color:var(--ink);text-decoration:none}.title a:hover{color:var(--brand)}.title-cn{margin:7px 0 0;color:#41504a;font-size:15px;line-height:1.55}.meta{margin:10px 0;color:var(--muted);font-size:12px;line-height:1.8}.tag{display:inline-block;background:var(--soft);color:var(--brand2);border-radius:999px;padding:4px 9px;margin:0 6px 6px 0;font-size:12px}.summary{font-size:14px;line-height:1.75;color:#35413c}.conclusion{margin-top:12px;padding:10px 12px;border-left:3px solid var(--brand);background:#f5faf8;border-radius:0 8px 8px 0;font-size:13px;line-height:1.65}.actions{white-space:nowrap}.error{border-color:#f0cccc}.error b{color:var(--danger)}.empty{text-align:center;padding:42px;color:var(--muted)}@media(max-width:640px){header{padding:22px 16px 42px}.head{display:block}.tools{margin-top:15px}.brand h1{font-size:22px}main{padding:0 12px}.panel,.card{border-radius:12px}.card-top{display:block}.actions{margin-top:8px}.bar,.search{flex-wrap:wrap}.search input{min-width:100%}}
</style></head><body><header><div class="head"><div class="brand"><h1>Paper Bot</h1><p>公众号或论文标题 · 自动识别 · 结构化中文解读</p></div><div class="tools"><a href="/api/export">导出 Markdown</a><a href="/api/backup">备份数据库</a></div></div></header><main><section class="panel"><textarea id="urls" placeholder="每行粘贴一个微信公众号链接，或一个完整英文论文标题"></textarea><div class="bar"><button id="go">添加并解析</button><button class="secondary" id="refresh">刷新</button></div><div class="status" id="status"></div><div id="errors"></div><div class="search"><input id="q" placeholder="搜索标题、作者、机构、关键词或期刊"><button class="secondary" id="searchBtn">搜索</button></div></section><div class="section-title"><h2>论文解读</h2><span id="count"></span></div><div id="list"></div></main>
<script>
const $=s=>document.querySelector(s);let pollTimer=null;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt){const r=await fetch(url,opt);let j;try{j=await r.json()}catch{j={error:'请求失败'}}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function load(){try{const q=$('#q').value.trim(),rows=await api('/api/list'+(q?'?q='+encodeURIComponent(q):''));$('#count').textContent=rows.length+' 篇';if(!rows.length){$('#list').innerHTML='<div class="card empty">还没有论文，先粘贴公众号文章或论文标题吧。</div>';return}$('#list').innerHTML=rows.map(r=>{const source=String(r.url||'').startsWith('https://')?`<a href="${esc(r.url)}" target="_blank" rel="noopener">公众号原文</a>`:'标题检索';const authors=[r.first_author?'第一作者 '+esc(r.first_author):'',r.corresponding_authors?'通讯作者 '+esc(r.corresponding_authors):''].filter(Boolean).join(' · ');const dateText=r.accepted_date?'Accepted '+esc(r.accepted_date):(r.pubdate?'发表 '+esc(r.pubdate):'');return `<article class="card"><div class="card-top"><div><h3 class="title"><a href="/detail.html?id=${r.id}">${esc(r.title||r.wxtitle||'(无标题)')}</a></h3>${r.title_cn?`<p class="title-cn">${esc(r.title_cn)}</p>`:''}</div><div class="actions"><button class="ghost reprocess" data-id="${r.id}">重新解析</button><button class="ghost danger del" data-id="${r.id}">删除</button></div></div><div class="meta">${dateText?dateText+' · ':''}${r.journal?esc(r.journal)+' · ':''}${r.pmid?'PMID '+esc(r.pmid)+' · ':''}${source}${authors?' · '+authors:''}${r.wx_pubtime?' · 推文 '+esc(r.wx_pubtime):''}</div><div>${String(r.keywords||'').split(/[,，]/).filter(Boolean).map(k=>`<span class="tag">${esc(k.trim())}</span>`).join('')}</div><div class="summary">${esc(r.summary)}</div>${r.conclusion?`<div class="conclusion"><b>一句话结论：</b>${esc(r.conclusion)}</div>`:''}</article>`}).join('');document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(!confirm('确定删除这条记录吗？'))return;await api('/api/item/'+b.dataset.id,{method:'DELETE'});load()});document.querySelectorAll('.reprocess').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/api/item/'+b.dataset.id+'/reprocess',{method:'POST'});$('#status').textContent='已加入重新解析队列';poll()}catch(e){$('#status').textContent=e.message}})}catch(e){$('#status').textContent='加载失败：'+e.message}}
async function poll(){try{const s=await api('/api/queue');const failed=(s.recent||[]).filter(j=>j.status==='error');$('#errors').innerHTML=failed.map(j=>`<div class="card error"><div class="card-top"><div><b>处理失败</b><div class="meta">${esc(j.url)}<br>${esc(j.error)}</div></div><button class="secondary retry" data-id="${j.id}">重试</button></div></div>`).join('');document.querySelectorAll('.retry').forEach(b=>b.onclick=async()=>{b.disabled=true;await api('/api/job/'+b.dataset.id+'/retry',{method:'POST'});poll()});const total=s.pending+s.active;if(total){$('#status').textContent=`处理中：排队 ${s.pending}，进行中 ${s.active}`;clearTimeout(pollTimer);pollTimer=setTimeout(poll,3000)}else{if(!failed.length)$('#status').textContent='全部处理完成';load()}}catch(e){$('#status').textContent='状态读取失败：'+e.message}}
$('#go').onclick=async()=>{const text=$('#urls').value.trim();let urls=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(urls.length===1){const found=text.match(/https:\/\/mp\.weixin\.qq\.com\/[^\s]+/g);if(found&&found.length)urls=found}if(!urls.length){$('#status').textContent='请粘贴公众号链接或完整论文标题';return}$('#go').disabled=true;try{const j=await api('/api/add-many',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls})});$('#urls').value='';$('#status').textContent=`已加入 ${j.queued} 条${j.existing?`，${j.existing} 条已存在`:''}`;poll()}catch(e){$('#status').textContent='提交失败：'+e.message}finally{$('#go').disabled=false}};$('#refresh').onclick=()=>{load();poll()};$('#searchBtn').onclick=load;$('#q').onkeydown=e=>{if(e.key==='Enter')load()};load();poll();
</script></body></html>
