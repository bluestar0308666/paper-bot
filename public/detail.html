<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文解读 · Paper Bot</title>
<style>
:root{--ink:#18221f;--muted:#6c7772;--line:#e5e9e7;--brand:#147d64;--soft:#edf7f3}*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.top{height:6px;background:linear-gradient(90deg,#0d5f4c,#28a17f)}main{max-width:860px;margin:0 auto;padding:25px 18px 60px}.back{display:inline-block;color:var(--brand);text-decoration:none;margin-bottom:25px}.hero,.section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:14px;box-shadow:0 8px 28px #23382f0a}h1{font-size:28px;line-height:1.38;margin:0}.cn{font-size:18px;line-height:1.55;color:#45534d;margin:12px 0 0}.meta{font-size:13px;color:var(--muted);margin-top:18px;line-height:1.8}.meta a{color:var(--brand)}.tags{margin-top:12px}.tag{display:inline-block;background:var(--soft);color:#0d654f;border-radius:999px;padding:5px 10px;margin:0 6px 6px 0;font-size:12px}.lead{font-size:16px;line-height:1.85;margin:20px 0 0}.conclusion{margin-top:18px;padding:14px 16px;background:#f0f8f5;border-left:4px solid var(--brand);border-radius:0 9px 9px 0;line-height:1.75}.section{padding:24px 26px}.section h2{font-size:19px;margin:0 0 13px;display:flex;align-items:center;gap:10px}.num{width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--brand);display:inline-grid;place-items:center;font-size:13px}.content{font-size:15px;line-height:1.9;white-space:pre-wrap;color:#34413c}.empty{text-align:center;color:var(--muted);padding:50px}@media(max-width:600px){main{padding:18px 11px 40px}.hero,.section{padding:20px;border-radius:12px}h1{font-size:23px}.cn{font-size:16px}}
</style></head><body><div class="top"></div><main><a class="back" href="/">← 返回论文库</a><div id="page" class="hero empty">正在加载论文解读…</div></main>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('id');
const labels=[['research_background','研究背景'],['core_breakthrough','核心突破'],['technical_innovation','技术创新'],['key_results','关键结果'],['applications','应用前景'],['future_outlook','未来展望'],['bioinformatics','生信视角解读'],['methodological_insight','方法学借鉴与生信思考'],['liver_cancer_assessment','肝癌相关研究现状'],['liver_cancer_design','迁移到肝癌的研究设计'],['liver_cancer_novelty','创新空间与撞题风险']];
fetch('/api/item/'+encodeURIComponent(id||'')).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||'加载失败');return j}).then(r=>{document.title=(r.title_cn||r.title||'论文解读')+' · Paper Bot';const sections=labels.filter(([k])=>r[k]).map(([k,label],i)=>`<section class="section"><h2><span class="num">${i+1}</span>${label}</h2><div class="content">${esc(r[k])}</div></section>`).join('');let papers=[];try{papers=JSON.parse(r.liver_related_papers||'[]')}catch{}const related=papers.length?`<section class="section"><h2>PubMed 检索依据</h2><div class="content">${papers.map(p=>`<a href="https://pubmed.ncbi.nlm.nih.gov/${encodeURIComponent(p.pmid)}/" target="_blank" rel="noopener">PMID ${esc(p.pmid)}</a> · ${esc(p.title)}${p.journal?' · '+esc(p.journal):''}`).join('<br><br>')}<div class="meta">检索时间：${esc(r.liver_checked_at||'')}。这是相关性检索，不等同于系统综述。</div></div></section>`:'';const authorInfo=[r.first_author?'第一作者：'+esc(r.first_author):'',r.corresponding_authors?'通讯作者（按末位作者推定）：'+esc(r.corresponding_authors):'',r.affiliations?'通讯作者所属机构：'+esc(r.affiliations):''].filter(Boolean).join('<br>');const sourceLink=String(r.url||'').startsWith('https://')?`<a href="${esc(r.url)}" target="_blank" rel="noopener">查看公众号原文</a>`:'标题检索';const dateText=r.accepted_date?'Accepted '+esc(r.accepted_date):(r.pubdate?'发表 '+esc(r.pubdate):'');document.querySelector('main').innerHTML=`<a class="back" href="/">← 返回论文库</a><article class="hero"><h1>${esc(r.title||r.wxtitle||'(无标题)')}</h1>${r.title_cn?`<p class="cn">${esc(r.title_cn)}</p>`:''}<div class="meta">${dateText?dateText+' · ':''}${r.journal?esc(r.journal)+' · ':''}${r.pmid?'PMID '+esc(r.pmid)+' · ':''}${r.doi?'DOI '+esc(r.doi)+' · ':''}${sourceLink}</div>${authorInfo?`<div style="margin-top:16px;padding:13px 15px;background:#f7f9f8;border-radius:9px;color:#46534e;font-size:13px;line-height:1.8">${authorInfo}</div>`:''}<div class="tags">${String(r.keywords||'').split(/[,，]/).filter(Boolean).map(k=>`<span class="tag">${esc(k.trim())}</span>`).join('')}</div>${r.summary?`<p class="lead">${esc(r.summary)}</p>`:''}${r.conclusion?`<div class="conclusion"><b>一句话结论：</b>${esc(r.conclusion)}</div>`:''}</article>${sections||'<section class="section empty">这条旧记录还没有深度解读，请返回后点击“重新解析”。</section>'}${related}`}).catch(e=>{document.querySelector('#page').textContent='加载失败：'+e.message});
</script></body></html>
